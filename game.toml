# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "MOH"
id = "SLES-02470"
players = 2
exe = "disc/SLES_024.70"
# Players pick their own disc in the launcher; developers pass --disc
# (see docs/DEVELOPMENT.md), so no machine-specific path is committed.
disc = "disc/Medal of Honor (Europe).cue"
load_address = "0x80010000"
entry_pc = "0x8001E004"
text_size = "0x0002A000"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Medal of Honor (Europe).bin"
cue_name = "Medal of Honor (Europe).cue"
boot_exe = "SLES_024.70"
known_sizes = [741980736]
known_md5 = [
  "5e2c8aaba7c3b939093584deb84711c8",
]
known_sha1 = [
  "8c2e96724118908833d0ca485760dd208238aa87",
]
known_crc32 = [
  "e5070481",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Mouse look (M4, src/mouse/moh_mouse_plugin.c): LEVEL.BIN's yaw store, the
# two aim-rate loads and the normal-play tilt rate load (free look, last).
# Widescreen (M5, src/widescreen/moh_widescreen_plugin.c): the same yaw store
# and aim-X load as the gameplay signal, the text glyph store and the ammo icon
# store to anchor the ammo counter, and the sky strip link to stretch the sky.
# The hooks only act while their package is enabled.
mod_instruction_sites = ["0x800801E0", "0x8007FC94", "0x8007FE7C", "0x8005FC1C", "0x800807C8", "0x8008A098",
                         "0x80080470"]

[runtime]
window_title = "Medal of Honor PAL Recompiled"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
multitap_analog = true
[netplay]
require_cue = true
required_tracks = 1
required_disc_fp = "d7a1aa9191b3dab30ba62c8d83960dd4f895ee3d7a06670feb011f9cc3a6dd18"

[widescreen]
native_wide = true
# The compass HUD (fixed packets, built by LEVEL.BIN 0x80060D04/0x80060B14)
# moves to the left edge by the thirds rule. The ammo counter shares its
# packet arena with the world, so moh.widescreen tags it instead.
nw_left_hud_packet_lo = "0x000ABF60"
nw_left_hud_packet_hi = "0x000AD7B8"

# Polygon rejection at the screen edges (M5 Task 3, found 2026-10-27): the boot
# EXE's triangle outcode test 0x80011214 (width 540 from 0x8009CE10) and
# LEVEL.BIN's node bounding-box test 0x8008B9C8; after the final review also
# LEVEL.BIN's actor/prop cube test 0x8008EB90 (soldiers) and its bullet-hole
# quad test 0x8008C6A8. The LEVEL2P.BIN and SHELL.BIN words at these addresses
# are other instructions, so the overlay variants keep vanilla code. Widened
# whenever the widescreen package is on (also on its 4:3 screens, where the
# draw area clips anyway); identity without it.
[widescreen.cull]
bltz_sites = [
    "0x8008BE14", "0x8008C330",                 # LEVEL.BIN node bbox, left reject
    "0x8008ED90",                               # LEVEL.BIN actor/prop cube, left reject
    "0x800113B0", "0x80011400", "0x80011440",   # EXE triangle outcode, left bits
]
bgez_sites = ["0x8008C944", "0x8008C984", "0x8008C9C0"]   # LEVEL.BIN bullet holes, left bit per vertex
screen_x_sites = ["0x800113B8", "0x80011408", "0x80011448"]   # sltu t8, SX, W
clip_edge_x_load_sites = [                                    # loads of W = 540
    "0x8008B9F0", "0x80011394",                 # node bbox, EXE triangles
    "0x8008EE28", "0x8008C93C",                 # actor/prop cube, bullet holes
]
clip_edge_width = 540
